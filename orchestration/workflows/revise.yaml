# Canonical Workflow Spec -- revise (WF-REVISE)
# PUBLIC, provider-neutral source of truth. Platform adapters are generated from this.
# Handoff names resolve against handoff-contracts.yaml; gate ids against quality-gates.yaml.
# COPYRIGHT/PRIVACY: original wording only; no concept-card ids; no book locators.

name: revise
description: >-
  Fix sentence- and paragraph-level prose -- flow, clarity, length, or thinness --
  without changing meaning. Diagnose the prose defect (watching for structural
  symptoms), apply the repair by task mode, reconcile any structure-versus-prose
  collision, then confirm no meaning or qualifier was lost.
depth: standard

triggers:
  - "Fix the flow."
  - "Make these sentences clearer."
  - "Cut this down without losing anything important."
  - "This part is too thin -- expand it."
non_triggers:
  - "The fault is structural -> restructure."
  - "Recalibrating for a different audience -> adapt-to-reader."

inputs:
  required:
    - passage
  optional:
    - reader-frame
    - task_mode
    - target_length

stages:
  - id: v1
    responsibility: >-
      Diagnose the prose defect and detect whether an apparent local incoherence
      is really a missing structural link.
    execution:
      type: skill
      component: diagnose-draft
    depends_on: []
    parallel_with: []
    input_contract: none
    output_contract: defect-report
    gate: none
    on_failure: return the finding
    on_ambiguity: if incoherence may be a structural gap, flag it for escalation

  - id: v2
    responsibility: >-
      Apply the sentence/paragraph repair for the requested task mode (cohere,
      clarify, compress, expand, usage) without adding a relation the text lacks.
    execution:
      type: skill
      component: revise-prose
    depends_on: [v1]
    parallel_with: []
    input_contract: defect-report
    output_contract: change-report
    gate: none
    on_failure: try an alternative construction
    on_ambiguity: attempt a both-satisfying rewrite first

  - id: v3
    responsibility: >-
      Reconcile any structure-versus-prose collision on the same passage; either
      produce a rewrite that satisfies both planes or escalate the trade-off.
    execution:
      type: human-check   # agent in deep mode
      component: cross-plane arbitration step
    depends_on: [v2]
    parallel_with: []
    input_contract: change-report
    output_contract: change-report
    gate: GATE-ROUTING
    on_failure: reject a meaning-altering fix under fidelity
    on_ambiguity: escalate the unresolved same-passage conflict; prose-to-structure escalation may route to restructure

  - id: v4
    responsibility: >-
      Confirm propositional meaning is preserved and no caveat, hedge, role, or
      referent was dropped.
    execution:
      type: tool
      component: revision-comparator
    depends_on: [v3]
    parallel_with: []
    input_contract: change-report
    output_contract: change-report
    gate: GATE-FIDELITY
    on_failure: fidelity rollback -> v2
    on_ambiguity: escalate to independent-reviewer

  - id: v5
    responsibility: >-
      Audit the revised passage against the complete methodology checklist (L0
      through L8 plus house style) before the revision is treated as final.
    execution:
      type: agent
      component: red-team-reviewer
    depends_on: [v4]
    parallel_with: []
    input_contract: change-report
    output_contract: defect-report
    gate: GATE-COMPLIANCE
    on_failure: route each finding back to its owning stage per orchestration/policies/red-team-policy.yaml; red-team-reviewer re-checks, looping up to max_iterations, else escalate
    on_ambiguity: treat an unmentioned checklist level as a gap to investigate, never as a pass

completion_conditions:
  - relation between adjacent sentences inferable
  - topic continuity holds
  - meaning and qualifiers preserved
  - the full checklist (L0-L8 plus house style) checked before the revision is final
failure_conditions:
  - a connective that misstates the real relation
  - papering over a structural gap with prose
  - a rewrite that inverts a role or drops a referent
  - a red-team finding silently dropped to force a pass
quality_metrics:
  - coherence-marker coverage
  - qualifier-set equality
  - referents resolvable
  - checklist coverage = 10/10 (L0-L8 plus house style)

notes:
  loops:
    - fidelity rollback: v4 blocks -> v2; exit is a passing fidelity gate advancing to v5
    - "red-team loop: v5 finding -> re-enter its owning stage, up to red-team-policy.yaml's max_iterations, else escalate; exit is a passing compliance gate (terminal)"
  escalations:
    - v1/v3 prose-to-structure -> restructure (transition, not a new workflow)
    - v4 residual role/sense doubt -> independent-reviewer
  terminal: v5
  reachable_completion: true

attestation: "no source prose copied; no card ids in public files"
